server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube Source plugin (required by LavaSrc)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
      repository: "https://maven.lavalink.dev/releases"
    # LavaSrc for Deezer/Spotify support
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.5.0"
      repository: "https://maven.topi.wtf/releases"


  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 2000
    frameBufferDurationMs: 10000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 1
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  # YouTube plugin - OAuth required for reliable playback
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
    oauth:
      enabled: true
      skipInitialization: true
      # After getting token from device code, add here:
      # refreshToken: "YOUR_TOKEN"


  lavasrc:

    providers:
      # Search priority: Deezer only (YouTube handled by yt-dlp)
      - "dzisrc:%ISRC%"       # Deezer ISRC (exact match)
      - "dzsearch:%QUERY%"    # Deezer search
      - "ytmsearch:%QUERY%"   # YouTube Music fallback
      - "ytsearch:%QUERY%"    # YouTube fallback
    sources:
      spotify: true           # Enable Spotify (playlists, albums, tracks - audio via Deezer)
      applemusic: true        # Enable Apple Music (playlists, albums - audio via Deezer)
      deezer: true            # Enable Deezer (direct audio)
      youtube: true           # Enable YouTube/YouTube Music
      tidal: false            # Disable (requires paid token)
      yandexmusic: false      # Disabled
      vkmusic: false          # Disabled
      flowerytts: false       # Disabled
    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID"
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"
      countryCode: "US"
      playlistLoadLimit: 10   # 10 pages x 100 = 1000 tracks max
      albumLoadLimit: 10      # 10 pages x 50 = 500 tracks max
      resolveArtistsInSearch: true
    applemusic:
      countryCode: "US"
      # mediaAPIToken: "YOUR_APPLE_MUSIC_TOKEN"  # Optional - works without for search/playlists
      playlistLoadLimit: 10
      albumLoadLimit: 10
    deezer:
      masterDecryptionKey: "g4el58wc0zvf9na1"
      arl: "YOUR_DEEZER_ARL_TOKEN"
      formats:
        - MP3_320
        - FLAC
        - MP3_128


logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000

  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 10
